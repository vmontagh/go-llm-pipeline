name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # New advisories are published without any code change, so rescan weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer PR run rescans all of the PR's commits, so it may cancel an older one.
# Every other run scans only the commits its push added, so each gets its own
# group; canceling one could skip the only scan of a leaked commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan for reachable vulnerabilities
        run: make vuln

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan the tree and new commits for secrets
        env:
          # PRs scan their own commits; pushes scan what the push added.
          SECRETS_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: make secrets SECRETS_BASE="$SECRETS_BASE"
