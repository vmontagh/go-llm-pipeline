name: Presubmit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read
      code-quality: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: make build

      - name: Test
        run: make test-unit-cover

      - name: Convert coverage to Cobertura
        run: |
          go install github.com/t-yuki/gocover-cobertura@latest
          gocover-cobertura < coverage.out > cobertura.xml

      - name: Upload Cobertura XML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: cobertura.xml
          retention-days: 14

      - name: Generate Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '50 75'

      - name: Post Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: code-coverage-results.md

      - name: Check Architecture Dependencies
        run: make lint-arch
