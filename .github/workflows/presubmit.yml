name: Presubmit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run tests and linting
    runs-on: self-hosted
    permissions:
      pull-requests: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: make build

      - name: Test
        run: make test-unit-cover

      - name: Convert coverage to Cobertura
        run: |
          go install github.com/t-yuki/gocover-cobertura@latest
          gocover-cobertura < coverage.out > cobertura.xml

      - name: Upload Cobertura XML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: cobertura.xml
          retention-days: 14

      - name: Cobertura Report
        uses: 5monkeys/cobertura-action@master
        if: github.event_name == 'pull_request'
        with:
          path: cobertura.xml
          minimum_coverage: 70
          fail_below_threshold: true
          show_line: true
          show_branch: true

      - name: Check Architecture Dependencies
        run: make lint-arch
