name: Presubmit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and linting
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: make build

      - name: Test
        run: make test-unit-cover

      - name: Check per-package coverage
        run: make cover-check

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Fork PRs get no secrets; the action falls back to tokenless upload.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
        continue-on-error: true

      - name: Test contrib modules
        run: make test-contrib

      - name: Convert coverage to Cobertura
        run: |
          go install github.com/t-yuki/gocover-cobertura@v0.0.0-20180217150009-aaee18c8195c
          gocover-cobertura < coverage.out > cobertura.xml

      - name: Upload Cobertura XML Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: cobertura.xml
          retention-days: 14

      - name: Cobertura Report
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
        if: github.event_name == 'pull_request'
        with:
          path: cobertura.xml
          minimum_coverage: 50
          fail_below_threshold: true
          show_line: true
          show_branch: true

      - name: Check Architecture Dependencies
        run: make lint-arch

  test-windows:
    # Runs the packages with Windows-specific locking and file handling.
    name: Run tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test -v ./pkg/pipeline/ ./internal/appendfile/
