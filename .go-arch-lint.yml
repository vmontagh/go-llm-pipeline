version: 3
allow:
  depOnAnyVendor: true

components:
  logger:
    in: pkg/logger/**
  trace:
    in: pkg/trace/**
  httputil:
    in: pkg/httputil/**
  observ:
    in: pkg/observ/**
  analyzer:
    in: pkg/analyzer
  provider:
    in: pkg/provider/**
  gemini:
    in: pkg/provider/gemini/**
  openai:
    in: pkg/provider/openai/**
  ollama:
    in: pkg/provider/ollama/**
  doctor:
    in: pkg/doctor/**
  strategy:
    in: pkg/strategy/**
  pipeline:
    in: pkg/pipeline/**
  policy:
    in: pkg/policy/**
  vcrpatch:
    in: pkg/vcrpatch/**
  llmtest:
    in: pkg/llmtest/**
  scrub:
    in: pkg/scrub/**
  llmvcr:
    in: pkg/llmvcr/**
  vcrtest:
    in: pkg/vcrtest/**
  vectorstore:
    in: pkg/vectorstore/**
  semcache:
    in: pkg/semcache/**
  examples:
    in: examples/**
  integtest:
    in: integ-test/**

deps:
  logger:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn: []

  trace:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn: []

  httputil:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn: []

  observ:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - observ

  policy:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - provider

  provider:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - trace
      - httputil
      - provider

  gemini:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - trace
      - httputil
      - provider

  openai:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - trace
      - httputil
      - provider

  ollama:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - trace
      - httputil
      - provider
      - vcrtest

  doctor:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - doctor
      - openai
      - ollama

  analyzer:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - trace
      - httputil
      - provider
      - policy
      - analyzer

  strategy:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - trace
      - policy
      - strategy

  pipeline:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - logger
      - pipeline

  vcrpatch:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - vcrpatch

  llmtest:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - vcrpatch

  scrub:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn: []

  llmvcr:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - llmvcr
      - scrub
      - provider
      - openai
      - gemini

  vcrtest:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - vcrtest
      - llmvcr
      - scrub

  vectorstore:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - vectorstore

  semcache:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - vectorstore
      - semcache

  examples:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - ollama
      - vectorstore

  integtest:
    anyProjectDeps: false
    anyVendorDeps: true
    mayDependOn:
      - ollama
      - vectorstore
      - vcrtest
