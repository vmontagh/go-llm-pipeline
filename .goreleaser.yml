# Releases are built by .github/workflows/release.yml when a v* tag is pushed.
# This is a library, so there are no binaries: the release carries a source
# archive, its checksum, and a keyless Sigstore signature of the checksums.
version: 2

project_name: go-llm-pipeline

builds:
  - skip: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}"

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  use: github-native

release:
  # Upload everything to a draft first; the workflow publishes it afterwards,
  # because an immutable release can't take new assets once published.
  draft: true
  replace_existing_draft: true
