run:
  issues-exit-code: 1
  tests: true
  go: "1.23"
linters:
  default: none
  enable:
    - bodyclose
    - err113
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unparam
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    goconst:
      min-len: 3
      min-occurrences: 2
      ignore-tests: true
    gocritic:
      disabled-checks:
        - ifElseChain
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      severity: error
      rules:
        - name: var-naming
          arguments:
            - []
            - []
          severity: error
        - name: get-return
          severity: error
        - name: receiver-naming
          severity: error
        - name: context-as-argument
          severity: error
        - name: argument-limit
          arguments:
            - 5
          severity: error
        - name: exported
          severity: error
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - goconst
          - gosec
      - path: integ-test
        linters:
          - goconst
          - gosec
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
